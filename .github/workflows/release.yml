name: Release theme

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: a release tag must pass the same suite as a main push before anything
  # is published. The workflow is reused rather than copied so the two never
  # drift apart.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert version files match the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # data/inkstone.toml is what the footer renders, so a tag that bumps
          # only package.json ships a site that still claims the old version.
          tag="${GITHUB_REF_NAME}"
          pkg="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          data="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' data/inkstone.toml)"
          echo "tag=${tag} package.json=${pkg} data/inkstone.toml=${data}"
          for v in "${pkg}" "${data}"; do
            if [ "v${v}" != "${tag}" ]; then
              echo "::error::tag ${tag} does not match ${v} — bump both package.json and data/inkstone.toml before tagging"
              exit 1
            fi
          done

      - name: Package source archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar --prefix="${tag#v}/" HEAD | gzip -9 > "dist/${tag}.tar.gz"
          git archive --format=zip --prefix="${tag#v}/" HEAD -o "dist/${tag}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
