# Inkstone theme — root hugo.toml.
#
# This file is NOT used to configure a Hugo site. It declares Hugo version
# compatibility for theme consumers (Hugo Modules / submodule users) and
# default markup config that mirrors common preferences.
#
# Site authors should override these in their own hugo.toml as needed.
# The actual demo site config lives in exampleSite/hugo.toml.

[module]
  [module.hugoVersion]
    extended = true
    min      = "0.128.0"
    # No `max` — forward compatibility preferred. Hugo Themes Gallery
    # currently builds on 0.161.x; bump min only when a breaking
    # change forces it.

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
  [markup.highlight]
    noClasses = false
    style     = "github"

[params]
  # Fill optional integrations so a minimal site can still build. Site
  # params override these; none are loaded unless the matching shortcode is
  # used by that page.
  jsdelivrMirror = "https://cdn.jsdelivr.net"
  g2Version = "5.4.8"
  mathjaxVersion = "4"
  mermaidVersion = "11.14.0"
  markmapVersion = "0.18.12"
  pseudocodeVersion = "latest"
  videojsVersion = "8.10.0"
  swiperVersion = "11.1.4"
  imageCompareViewerVersion = "1.6.2"
  jQueryVersion = "3.7.1"
  justifiedgalleryVersion = "3.8.1"
  lightgalleryVersion = "2.9.0"
  APlayerVersion = "1.10.1"
  metingjsVersion = "2.0.2"
  metingApi = "https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id&auth=:auth&r=:r"
  clipboardjsVersion = "2.0.11"
  tippyVersion = "6.3.7"
  popperVersion = "2.11.8"
