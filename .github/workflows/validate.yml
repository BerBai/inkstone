name: Validate theme

on:
  push:
    branches: [main]
    paths:
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'i18n/**'
      - 'data/**'
      - 'exampleSite/**'
      - 'tests/**'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'i18n/**'
      - 'data/**'
      - 'exampleSite/**'
      - 'tests/**'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true
      - name: Install Hugo 0.128 minimum
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-0.128"
          curl -fsSL --retry 2 \
            https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/hugo-0.128.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo-0.128.tar.gz" -C "$RUNNER_TEMP/hugo-0.128" hugo
      - name: Install theme dependencies
        run: npm ci --no-audit --no-fund
      - name: Run fixture, output, HTML, browser, and performance checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HUGO_0_128_BIN: ${{ runner.temp }}/hugo-0.128/hugo
        run: npm test
