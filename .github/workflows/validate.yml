name: Validate theme

on:
  push:
    branches: [main]
    paths:
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'i18n/**'
      - 'data/**'
      - 'exampleSite/**'
      - 'tests/**'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'i18n/**'
      - 'data/**'
      - 'exampleSite/**'
      - 'tests/**'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert version files agree
        # data/inkstone.toml is rendered in the footer; package.json is what the
        # release job checks. They drifted at v0.2.1 and shipped "v0.2.0" on a
        # v0.2.1 site, so keep them locked together on every push instead.
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          data="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' data/inkstone.toml)"
          echo "package.json=${pkg} data/inkstone.toml=${data}"
          if [ "${pkg}" != "${data}" ]; then
            echo "::error::package.json (${pkg}) and data/inkstone.toml (${data}) disagree"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true
      - name: Install Hugo 0.128 minimum
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-0.128"
          curl -fsSL --retry 2 \
            https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/hugo-0.128.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo-0.128.tar.gz" -C "$RUNNER_TEMP/hugo-0.128" hugo
      - name: Install theme dependencies
        run: npm ci --no-audit --no-fund
      - name: Run fixture, output, HTML, browser, and performance checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HUGO_0_128_BIN: ${{ runner.temp }}/hugo-0.128/hugo
        run: npm test
